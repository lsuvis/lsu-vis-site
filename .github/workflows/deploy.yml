name: Deploy to vis.lsu.edu

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, vis-deploy]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy static site to /var/www/vis
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE"
          DEST="/var/www/vis"
          BACKUP_ROOT="/var/www/vis-backups"
          TS="$(date +%Y%m%d-%H%M%S)"
          SITE_FILES=(index.html styles.css script.js lsu-vis-logo.png robots.txt sitemap.xml)
          while IFS= read -r -d '' file; do
            SITE_FILES+=("$file")
          done < <(git -C "$SRC" ls-files -z -- 'google*.html')

          mkdir -p "$BACKUP_ROOT/vis-$TS"
          for file in "${SITE_FILES[@]}"; do
            if [ -f "$DEST/$file" ]; then
              cp -p "$DEST/$file" "$BACKUP_ROOT/vis-$TS/"
            fi
          done

          # The document root also hosts independent projects. Only update this
          # site's files; never delete or change permissions on sibling content.
          for file in "${SITE_FILES[@]}"; do
            rsync -rltp --no-owner --no-group --chmod=F644 "$SRC/$file" "$DEST/"
          done

          # New files normally inherit the document root's SELinux context.
          for file in "${SITE_FILES[@]}"; do
            restorecon "$DEST/$file" || true
          done

          echo "Deployed $(git -C "$SRC" rev-parse --short HEAD) to $DEST"

      - name: Verify site responds
        run: |
          set -euo pipefail
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)"
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "Deployment verification failed with status $code" >&2
            exit 1
          fi
          curl -fsk https://localhost/sitemap.xml > /dev/null
          curl -fsk https://localhost/robots.txt > /dev/null
